[build-system]
requires = ["setuptools>=80,<84", "wheel>=0.45,<0.48"]
build-backend = "setuptools.build_meta"

[project]
name = "dusk-control-plane"
version = "0.1.0"
description = "Production multi-tenant security control plane for DUSK."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Dusk contributors"}]
dependencies = [
    "fastapi>=0.116,<1",
    "pydantic-settings>=2.10,<3",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.12,<3",
    "mypy>=1.10",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4.4",
]

[project.scripts]
dusk-control-plane = "dusk_control_plane.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "S", "B", "C90", "UP", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true

[tool.bandit]
exclude_dirs = ["tests"]
