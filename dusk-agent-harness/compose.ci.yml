# CI-only override: require authentication and select watch/enforce explicitly.
# Always layer this file over compose.yml so the local-only bindings and
# container hardening controls remain active.
services:
  dusk-gate:
    environment:
      DUSK_ENFORCE: "${DUSK_ENFORCE:?set DUSK_ENFORCE for the CI sandbox}"
      DUSK_GATE_API_KEY: "${DUSK_GATE_API_KEY:?set DUSK_GATE_API_KEY for the CI sandbox}"
