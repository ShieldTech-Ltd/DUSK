# DUSK agent-action-monitor -- self-contained example stack.
# `docker compose up` runs the whole thing keyless, on an internal network,
# with no external egress. Watch mode is the default; enforce is an explicit
# switch (DUSK_ENFORCE). mock-prod and agent-demo (Tanvir's lane, T5/T6) are
# both built out now -- see mock-prod/ and agent-demo/.

services:
  dusk-gate:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DUSK_ENFORCE: "false"
      DUSK_GATE_BASELINE_PATH: ""
      DUSK_GATE_BASELINE_SOURCE: "generic"
      DUSK_DEMO_INTEGRATIONS: "false"
      DUSK_SIE_ENDPOINT: "http://sie:8080"
      DUSK_SIE_ENCODE_MODEL: "BAAI/bge-m3"
      DUSK_SIE_SCORE_MODEL: "BAAI/bge-reranker-v2-m3"
      DUSK_SIE_EXTRACT_MODEL: "urchade/gliner_multi-v2.1"
      DUSK_N8N_ALERT_URL: "http://n8n:5678/webhook/dusk-alert"
      DUSK_N8N_REPORT_URL: "http://n8n:5678/webhook/dusk-report"
      DUSK_N8N_DECISION_URL: "http://n8n:5678/webhook/dusk-decision"
    depends_on: [sie, n8n]
    networks: [internal]
    ports: ["8000:8000"] # /v1/gate

  sie:
    image: ghcr.io/superlinked/sie-server:latest-cpu-default
    volumes:
      - sie-hf-cache:/app/.cache/huggingface
    networks: [internal]
    # No ports published: internal-only. Add "8080:8080" locally to poke it.

  n8n:
    image: n8nio/n8n
    environment:
      N8N_SECURE_COOKIE: "false"
    networks: [internal]
    ports: ["5678:5678"] # open the n8n UI to import the workflow

  mock-prod:
    build:
      context: ./mock-prod
    environment:
      MOCK_PROD_HOST: "0.0.0.0"
    networks: [internal]
    ports: ["9000:9000"] # /apply, /log -- watch the applied-actions log from the host
    # Dummy controller/DB target: actions hit /apply on ALLOW, never on BLOCK.

  agent-demo:
    build:
      context: ./agent-demo
    environment:
      USE_REAL_BEDROCK: "false"
      DUSK_GATE_URL: "http://dusk-gate:8000/v1/gate"
      MOCK_PROD_URL: "http://mock-prod:9000/apply"
    depends_on: [dusk-gate, mock-prod]
    networks: [internal]
    # mock-Bedrock by default (keyless); USE_REAL_BEDROCK=true for real Bedrock.

networks:
  internal:
    driver: bridge

volumes:
  sie-hf-cache:
