# DUSK agent-action-monitor -- self-contained example stack.
# `docker compose up dusk-gate sie n8n` runs the gate keyless, on an internal
# network, with no external egress. Watch mode is the default; enforce is an
# explicit switch (DUSK_ENFORCE). mock-prod and agent-demo are Tanvir's lane
# (T5/T6); their build contexts don't exist until that work lands, so bring
# up the stack by naming dusk-gate/sie/n8n explicitly until then (R9).

services:
  dusk-gate:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DUSK_ENFORCE: "false"
      DUSK_GATE_BASELINE_PATH: ""
      DUSK_GATE_BASELINE_SOURCE: "generic"
      DUSK_DEMO_INTEGRATIONS: "false"
      DUSK_SIE_ENDPOINT: "http://sie:8080"
      DUSK_SIE_ENCODE_MODEL: "BAAI/bge-m3"
      DUSK_SIE_SCORE_MODEL: "BAAI/bge-reranker-v2-m3"
      DUSK_SIE_EXTRACT_MODEL: "urchade/gliner_multi-v2.1"
      DUSK_N8N_ALERT_URL: "http://n8n:5678/webhook/dusk-alert"
      DUSK_N8N_REPORT_URL: "http://n8n:5678/webhook/dusk-report"
      DUSK_N8N_DECISION_URL: "http://n8n:5678/webhook/dusk-decision"
    depends_on: [sie, n8n]
    networks: [internal]
    ports: ["8000:8000"] # /v1/gate

  sie:
    image: ghcr.io/superlinked/sie-server:latest-cpu-default
    volumes:
      - sie-hf-cache:/app/.cache/huggingface
    networks: [internal]
    # No ports published: internal-only. Add "8080:8080" locally to poke it.

  n8n:
    image: n8nio/n8n
    environment:
      N8N_SECURE_COOKIE: "false"
    networks: [internal]
    ports: ["5678:5678"] # open the n8n UI to import the workflow

  mock-prod:
    build:
      context: ./mock-prod
    networks: [internal]
    # Tanvir's lane (T5): dummy controller/DB target actions hit on ALLOW.

  agent-demo:
    build:
      context: ./agent-demo
    environment:
      USE_REAL_BEDROCK: "false"
      DUSK_GATE_URL: "http://dusk-gate:8000/v1/gate"
      MOCK_PROD_URL: "http://mock-prod:9000/apply"
    depends_on: [dusk-gate, mock-prod]
    networks: [internal]
    # Tanvir's lane (T2-T4, T6): mock-Bedrock by default, keyless.

networks:
  internal:
    driver: bridge

volumes:
  sie-hf-cache:
