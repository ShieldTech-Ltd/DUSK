#cloud-config
package_update: true
packages:
  - dnf-plugins-core
  - git
  - nodejs
  - curl
  - policycoreutils-python-utils
write_files:
  - path: /etc/sudoers.d/101-oracle-cloud-agent-run-command
    owner: root:root
    permissions: "0440"
    content: |
      ocarun ALL=(ALL) NOPASSWD:ALL
  - path: /etc/docker/daemon.json
    permissions: "0644"
    content: |
      {"live-restore":true,"log-driver":"json-file","log-opts":{"max-size":"10m","max-file":"3"}}
  - path: /usr/local/sbin/dusk-demo-bootstrap
    owner: root:root
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      if [[ ! -f /etc/yum.repos.d/docker-ce.repo ]]; then
        dnf config-manager --add-repo https://download.docker.com/linux/rhel/docker-ce.repo
      fi
      rpm --import https://download.docker.com/linux/rhel/gpg

      docker_installed=false
      for attempt in 1 2 3 4 5; do
        dnf clean metadata
        if dnf --refresh install -y \
          docker-ce-3:29.8.1-1.el9 \
          docker-ce-cli-1:29.8.1-1.el9 \
          containerd.io \
          docker-buildx-plugin \
          docker-compose-plugin; then
          docker_installed=true
          break
        fi
        echo "Docker package transaction failed on attempt ${attempt}/5" >&2
        sleep 30
      done
      [[ $docker_installed == true ]]

      curl --fail --location --silent --show-error --output /tmp/cosign.rpm \
        https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-3.1.3-1.aarch64.rpm
      echo '17c9fc9d0cb7f54492dc297ea75f8ea992576071e933a859120a2647abbfa347  /tmp/cosign.rpm' \
        | sha256sum --check --strict
      rpm --upgrade --replacepkgs /tmp/cosign.rpm

      systemctl enable --now docker
      mkdir -p /opt/dusk/config/console /opt/dusk/config/keycloak \
        /opt/dusk/config/traefik /opt/dusk/state /etc/dusk-demo
      chmod 0750 /opt/dusk /opt/dusk/config /opt/dusk/state /etc/dusk-demo
      if [[ ! -d /opt/dusk/repository/.git ]]; then
        git clone --filter=blob:none https://github.com/ShieldTech-Ltd/DUSK.git \
          /opt/dusk/repository
      fi
      chmod +x /opt/dusk/repository/deploy/public-demo/scripts/deploy.sh \
        /opt/dusk/repository/deploy/public-demo/scripts/reset-demo.sh
      cp /opt/dusk/repository/deploy/public-demo/systemd/dusk-demo-reset.service \
        /etc/systemd/system/
      cp /opt/dusk/repository/deploy/public-demo/systemd/dusk-demo-reset.timer \
        /etc/systemd/system/
      cp /opt/dusk/repository/deploy/public-demo/systemd/dusk-demo-health.service \
        /etc/systemd/system/
      cp /opt/dusk/repository/deploy/public-demo/systemd/dusk-demo-health.timer \
        /etc/systemd/system/
      systemctl daemon-reload
      systemctl enable --now dusk-demo-reset.timer dusk-demo-health.timer
      docker version
      docker compose version
      cosign version
runcmd:
  - [/usr/local/sbin/dusk-demo-bootstrap]
final_message: DUSK public demo host bootstrap completed
