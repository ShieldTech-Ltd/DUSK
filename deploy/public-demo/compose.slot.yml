name: dusk-public-demo-${DUSK_SLOT:?required}

services:
  migration:
    image: ${CONTROL_PLANE_IMAGE:?required}
    command: [dusk-control-plane-migrate]
    environment: &database-environment
      DUSK_CP_ENVIRONMENT: production
      DUSK_CP_DATABASE_URL: postgresql+asyncpg://dusk_control_plane:${POSTGRES_PASSWORD:?required}@postgresql/dusk_public_demo
    networks: [data]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"

  control-plane:
    image: ${CONTROL_PLANE_IMAGE:?required}
    container_name: control-plane-${DUSK_SLOT}
    environment:
      <<: *database-environment
      DUSK_CP_HOST: 0.0.0.0
      DUSK_CP_PORT: "8080"
      DUSK_CP_API_DOCS_ENABLED: "false"
      DUSK_CP_PUBLIC_DEMO_MODE: "true"
      DUSK_CP_V2_ENABLED: "true"
      DUSK_CP_EVALUATION_API_ENABLED: "false"
      DUSK_CP_OIDC_ISSUER: ${AUTH_URL}/realms/dusk-demo
      DUSK_CP_OIDC_AUDIENCE: dusk-control-plane
      DUSK_CP_OIDC_JWKS_URI: ${AUTH_URL}/realms/dusk-demo/protocol/openid-connect/certs
      DUSK_CP_STORAGE_ENABLED: "true"
      DUSK_CP_DATABASE_POOL_SIZE: "5"
      DUSK_CP_DATABASE_MAX_OVERFLOW: "2"
      DUSK_CP_DECISION_READ_API_ENABLED: "true"
      DUSK_CP_DASHBOARD_READ_API_ENABLED: "true"
      DUSK_CP_OPERATIONS_READ_API_ENABLED: "true"
      DUSK_CP_DECISION_CURSOR_SIGNING_KEY: ${DECISION_CURSOR_SIGNING_KEY:?required}
      DUSK_CP_CORS_ALLOWED_ORIGINS: '["${CONSOLE_URL:?required}"]'
      DUSK_CP_OUTBOX_WORKER_ENABLED: "false"
      DUSK_CP_ENFORCEMENT_BROKER_ENABLED: "false"
    networks: [application, data]
    depends_on:
      migration: {condition: service_completed_successfully}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/readyz', timeout=3)"]
      interval: 10s
      timeout: 3s
      retries: 6
    deploy:
      resources:
        limits: {cpus: "0.75", memory: 1G}
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  console:
    image: ${CONSOLE_IMAGE:?required}
    container_name: console-${DUSK_SLOT}
    volumes:
      - ${DUSK_CONFIG_DIRECTORY:-/opt/dusk/config}/console/config.json:/usr/share/nginx/html/config.json:ro
      - ${DUSK_CONFIG_DIRECTORY:-/opt/dusk/config}/console/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [application]
    depends_on:
      control-plane: {condition: service_healthy}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 10s
      timeout: 3s
      retries: 6
    deploy:
      resources:
        limits: {cpus: "0.20", memory: 192M}
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  demo-reset:
    image: ${CONTROL_PLANE_IMAGE:?required}
    command: [dusk-control-plane-demo-reset]
    profiles: [maintenance]
    environment:
      <<: *database-environment
      DUSK_CP_PUBLIC_DEMO_MODE: "true"
      DUSK_DEMO_RESET_CONFIRM: 11111111-1111-4111-8111-111111111111
    networks: [data]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"

networks:
  application:
    name: dusk-public-application
    external: true
  data:
    name: dusk-public-data
    external: true
