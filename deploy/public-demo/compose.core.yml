name: dusk-public-demo-core

services:
  traefik:
    image: traefik:v3.5.2@sha256:f0abbbd11ced29754d4d188c29e9320b613481ec162b6ea5d3a8b6bdd8e5fa54
    command:
      - --api.dashboard=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:8080
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:8443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?required}
      - --certificatesresolvers.letsencrypt.acme.storage=/certificates/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --log.level=INFO
      - --accesslog=true
      - --accesslog.format=json
    ports:
      - 80:8080
      - 443:8443
    volumes:
      - ${DUSK_CONFIG_DIRECTORY:-/opt/dusk/config}/traefik:/etc/traefik/dynamic:ro
      - traefik-certificates:/certificates
    networks: [edge, application]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits: {cpus: "0.20", memory: 192M}
    logging: &bounded-logging
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  postgresql:
    image: postgres:17.11-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
    environment:
      POSTGRES_DB: dusk_public_demo
      POSTGRES_USER: dusk_control_plane
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      KEYCLOAK_DATABASE_PASSWORD: ${KEYCLOAK_DATABASE_PASSWORD:?required}
    volumes:
      - postgresql-data:/var/lib/postgresql/data
      - ./postgresql/init-keycloak.sh:/docker-entrypoint-initdb.d/10-keycloak.sh:ro
    networks: [data]
    restart: unless-stopped
    shm_size: 256m
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U dusk_control_plane -d dusk_public_demo"]
      interval: 10s
      timeout: 3s
      retries: 10
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits: {cpus: "0.75", memory: 2G}
    logging: *bounded-logging

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3@sha256:6a7217a100bd3e5de4063a27a538ef999a3c5a88c4b4ec0ffc0a642aee7b2597
    command:
      - start
      - --import-realm
      - --hostname=${AUTH_URL:?required}
      - --http-enabled=true
      - --proxy-headers=xforwarded
      - --health-enabled=true
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgresql:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DATABASE_PASSWORD:?required}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?required}
      JAVA_OPTS_KC_HEAP: -Xms384m -Xmx1024m
    volumes:
      - ${DUSK_CONFIG_DIRECTORY:-/opt/dusk/config}/keycloak/dusk-demo-realm.json:/opt/keycloak/data/import/dusk-demo-realm.json:ro
    networks: [application, data]
    depends_on:
      postgresql: {condition: service_healthy}
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, "timeout 2 bash -c '</dev/tcp/127.0.0.1/9000'"]
      interval: 10s
      timeout: 3s
      start_period: 45s
      retries: 20
    deploy:
      resources:
        limits: {cpus: "0.75", memory: 2G}
    logging: *bounded-logging

networks:
  edge:
    name: dusk-public-edge
  application:
    name: dusk-public-application
  data:
    name: dusk-public-data
    internal: true

volumes:
  postgresql-data:
  traefik-certificates:
