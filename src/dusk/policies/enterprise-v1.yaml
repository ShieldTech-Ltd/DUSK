  - <<: *planned
    id: DUSK-SC-001
    title: Require approval for dependency installation
    category: supply-chain
    severity: high
    decision: REQUIRE_APPROVAL
    prerequisites: [package identity and provenance]
  - <<: *planned
    id: DUSK-SC-002
    title: Prevent package hallucination and substitution
    category: supply-chain
    prerequisites: [trusted package registry metadata]
  - <<: *planned
    id: DUSK-SC-003
    title: Prevent execution of unverified artifacts
    category: supply-chain
    prerequisites: [artifact digest and provenance]
  - <<: *planned
    id: DUSK-SC-004
    title: Require immutable automation dependencies
    category: supply-chain
    prerequisites: [workflow and image reference parser]
  - <<: *planned
    id: DUSK-BEH-001
    title: Detect discovery credential access and exfiltration sequence
    category: behavior
    prerequisites: [session event correlation, data-flow labels]
  - <<: *planned
    id: DUSK-BEH-002
    title: Detect download permission-change execution sequence
    category: behavior
