name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.11" }
      - name: Install release tooling
        run: python -m pip install --upgrade build pip-audit
      - name: Audit declared dependencies
        run: pip-audit -r requirements.txt
      - name: Verify release version
        if: github.event_name == 'release'
        run: python scripts/check_release_version.py "${GITHUB_REF_NAME}"
      - name: Build source and wheel artifacts
        run: python -m build
      - name: Generate CycloneDX SBOM
        run: pip-audit -r requirements.txt --format cyclonedx-json --output dist/dusk-sbom.json
      - name: Generate checksums
        run: shasum -a 256 dist/* > dist/SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: "dist/*"
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dusk-release-artifacts
          path: dist/
          if-no-files-found: error
      - name: Attach artifacts to GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
