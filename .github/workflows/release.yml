name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing verified annotated tag used for a dry run
        required: true
        type: string
      publish:
        description: Publish after verification
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions: {contents: read, id-token: write, attestations: write}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}
      - run: pip install build twine pip-audit PyYAML
      - env:
          RELEASE_REF: ${{ inputs.release_ref || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/ci/run_group.py --results results/release
          --controls REL-001 REL-002 REL-003 REL-004 REL-005 REL-006 REL-007 --
          sh scripts/ci/release_controls.sh "$RELEASE_REF"
      - id: attest
        continue-on-error: true
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.2.0
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.json
            dist/SHA256SUMS
      - env: {OUTCOME: "${{ steps.attest.outcome }}"}
        run: |
          status=$(test "$OUTCOME" = success && echo PASS || echo FAIL)
          python scripts/ci/control.py record --control REL-008 --status "$status" --output results/release/REL-008.json --details "attestation $OUTCOME"
          test "$status" = PASS
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: release-control-results, path: "results/", if-no-files-found: error, retention-days: 30}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: release-artifacts, path: "dist/", if-no-files-found: error, retention-days: 30}

  release-gate:
    if: always()
    needs: [release-controls]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}
      - run: pip install PyYAML
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: release-control-results, path: results}
      - env: {UPSTREAM: "${{ needs.release-controls.result }}"}
        run: |
          test "$UPSTREAM" = success
          python scripts/ci/control.py aggregate --lane release --results results

  publish:
    needs: [release-gate]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: release-artifacts, path: dist}
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ inputs.release_ref || github.ref_name }}
        run: gh release create "$RELEASE_REF" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "DUSK $RELEASE_REF"
