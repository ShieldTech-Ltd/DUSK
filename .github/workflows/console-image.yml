name: Console OCI supply chain

on:
  pull_request:
    branches: [dev]
    paths:
      - apps/console/**
      - docs/dusk-hero-banner.svg
      - docs/dusk-logo.svg
      - .github/workflows/console-image.yml
  push:
    branches: [dev]
    tags: ["v*"]
    paths-ignore: ["docs/**"]

permissions:
  contents: read

concurrency:
  group: console-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/console/Dockerfile
          push: false
          platforms: linux/amd64
          provenance: false
          sbom: false

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/shieldtech-ltd/dusk-console
          tags: |
            type=sha,format=long
            type=ref,event=tag
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/console/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign the immutable image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/shieldtech-ltd/dusk-console
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Generate the immutable SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ghcr.io/shieldtech-ltd/dusk-console@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: console-sbom.spdx.json
          upload-artifact: false
      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ghcr.io/shieldtech-ltd/dusk-console
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Attest the SPDX SBOM
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3
        with:
          subject-name: ghcr.io/shieldtech-ltd/dusk-console
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: console-sbom.spdx.json
          push-to-registry: true
      - name: Record immutable promotion input
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/shieldtech-ltd/dusk-console
        run: |
          mkdir -p console-image-evidence
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > console-image-evidence/image-reference.txt
          cp console-sbom.spdx.json console-image-evidence/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: console-image-${{ github.sha }}
          path: console-image-evidence/
          if-no-files-found: error
          retention-days: 90
