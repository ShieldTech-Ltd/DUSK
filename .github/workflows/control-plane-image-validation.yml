name: Control-plane OCI validation

on:
  pull_request:
    branches: [dev]
    paths:
      - services/control-plane/**
      - src/**
      - pyproject.toml
      - .github/workflows/control-plane-image.yml
      - .github/workflows/control-plane-image-validation.yml

permissions:
  contents: read

concurrency:
  group: control-plane-image-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: services/control-plane/Dockerfile
          push: false
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          build-args: |
            OCI_REVISION=${{ github.sha }}
            OCI_VERSION=${{ github.ref_name }}
            SOURCE_DATE_EPOCH=0
