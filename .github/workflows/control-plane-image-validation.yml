name: Control-plane OCI validation

on:
  pull_request:
    branches: [dev]
    paths:
      - services/control-plane/**
      - src/**
      - pyproject.toml
      - .github/workflows/control-plane-image.yml
      - .github/workflows/control-plane-image-validation.yml

permissions:
  contents: read

concurrency:
  group: control-plane-image-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/control-plane/Dockerfile
          push: false
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          build-args: |
            OCI_REVISION=${{ github.sha }}
            OCI_VERSION=${{ github.ref_name }}
            SOURCE_DATE_EPOCH=0
