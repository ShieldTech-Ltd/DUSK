name: Console OCI validation

on:
  pull_request:
    branches: [dev]
    paths:
      - apps/console/**
      - docs/dusk-hero-banner.svg
      - docs/dusk-logo.svg
      - .github/workflows/console-image.yml
      - .github/workflows/console-image-validation.yml

permissions:
  contents: read

concurrency:
  group: console-image-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/console/Dockerfile
          push: false
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
