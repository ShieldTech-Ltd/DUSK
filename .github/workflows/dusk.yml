name: CI
on:
  push: {branches: [dev, main]}
  pull_request: {branches: [dev, main]}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  PYTHONPATH: "."

jobs:
  correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            examples/agent-action-monitor/pyproject.toml
      - run: >-
          pip install -e ".[dev]" vulture openapi-spec-validator==0.9.0
          flask flask-cors gunicorn python-dotenv requests
          -r examples/agent-action-monitor/agent-demo/requirements.txt
          -r examples/agent-action-monitor/mock-prod/requirements.txt
      - name: Run integrity, quality, contracts, and tests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python scripts/ci/run_group.py --results results/correctness
          --controls PR-001 PR-002 PR-003 PR-004 PR-005 PR-006 PR-007 PR-008 PR-009 PR-010
          PR-011 PR-012 PR-013 PR-014 PR-015 PR-016 PR-017 PR-018 PR-019 PR-020 PR-021 PR-022
          PR-023 PR-024 PR-025 PR-026 PR-027 PR-028 PR-029 PR-030 PR-031 PR-032 PR-033 PR-034
          PR-035 PR-036 PR-037 PR-038 PR-039 PR-040 PR-041 PR-042 --
          sh scripts/ci/pr_correctness.sh "$BASE_SHA" "$HEAD_SHA"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: correctness-results, path: results/, if-no-files-found: error, retention-days: 30}

  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: "3.11", control: PR-043}
          - {python: "3.12", control: PR-044}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "${{ matrix.python }}", cache: pip, cache-dependency-path: pyproject.toml}
      - run: pip install -e ".[dev]"
      - run: >-
          python scripts/ci/run_group.py --results results/compat-${{ matrix.python }}
          --controls ${{ matrix.control }} -- pytest -q
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: "compatibility-${{ matrix.python }}-results", path: results/, if-no-files-found: error, retention-days: 30}

  security-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements.txt}
      - run: >-
          pip install bandit[toml] pip-audit semgrep==1.172.0 detect-secrets
          actionlint-py==1.7.12.24 zizmor==1.29.0
      - name: Run SAST, secret, dependency, and workflow policy checks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python scripts/ci/run_group.py --results results/security
          --controls SEC-002 SEC-003 SEC-004 SEC-005 SEC-006 SEC-007 SEC-008 SEC-009 SEC-010 SEC-011
          SEC-012 SEC-013 SEC-014 SEC-017 SEC-018 SEC-020 SEC-021 SEC-022 SEC-023 SEC-024 SEC-025
          SEC-026 PR-045 PR-046 PR-047 PR-048 --
          sh scripts/ci/pr_security.sh "$BASE_SHA" "$HEAD_SHA"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: security-results, path: results/, if-no-files-found: error, retention-days: 30}

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {contents: read, security-events: write}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: github/codeql-action/init@c3400c2f38909e0dcf3c3a41f2030a8217be5d3e # v3.28.17
        with: {languages: python, queries: security-extended}
      - id: analyze
        continue-on-error: true
        uses: github/codeql-action/analyze@c3400c2f38909e0dcf3c3a41f2030a8217be5d3e # v3.28.17
      - env: {OUTCOME: "${{ steps.analyze.outcome }}"}
        run: |
          status=$(test "$OUTCOME" = success && echo PASS || echo FAIL)
          python scripts/ci/control.py record --control SEC-001 --status "$status" --output results/codeql/SEC-001.json --details "CodeQL $OUTCOME"
          test "$status" = PASS
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: codeql-results, path: results/, if-no-files-found: error, retention-days: 30}

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - run: >-
          python scripts/ci/run_group.py --results results/containers
          --controls CTR-001 CTR-002 CTR-003 CTR-004 CTR-005 CTR-006 CTR-007 CTR-008 CTR-009 CTR-010 --
          sh scripts/ci/container_controls.sh
      - name: OWASP watch scenario using scanned images
        working-directory: examples/agent-action-monitor
        run: sh scripts/run_owasp_demo.sh --no-build watch
      - name: OWASP enforce scenario using scanned images
        working-directory: examples/agent-action-monitor
        run: sh scripts/run_owasp_demo.sh --no-build enforce
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: container-results, path: results/, if-no-files-found: error, retention-days: 30}

  security-gate:
    if: always()
    needs: [correctness, compatibility, security-tools, codeql, containers]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}
      - run: pip install PyYAML
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {pattern: "*-results", path: all-results, merge-multiple: true}
      - env: {NEEDS_JSON: "${{ toJSON(needs) }}"}
        run: |
          failures=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"' <<<"$NEEDS_JSON")
          test -z "$failures" || { echo "$failures"; exit 1; }
          python scripts/ci/control.py aggregate --lane pr --results all-results
