name: Cloudflare native image candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-image-publication
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      checks: read
      deployments: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify main, exact-head CI and protected reviewer configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci/cloudflare_release_gate.py

  publish:
    needs: preflight
    environment: cloudflare-sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      checks: read
      deployments: read
      packages: write
      id-token: write
      attestations: write
    services:
      postgresql:
        image: postgres:17.11-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
        env:
          POSTGRES_DB: dusk_control_plane
          POSTGRES_USER: dusk_control_plane
          POSTGRES_PASSWORD: ci-container-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dusk_control_plane -d dusk_control_plane"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      IMAGE: ghcr.io/shieldtech-ltd/dusk-cloudflare-runtime
      DUSK_TEST_DATABASE_URL: postgresql+asyncpg://dusk_control_plane:ci-container-only@127.0.0.1:5432/dusk_control_plane
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Recheck release gate after approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci/cloudflare_release_gate.py
      - name: Build, boot and scan exact candidate images
        run: sh scripts/ci/container_controls.sh
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the same scanned native image
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          python scripts/ci/cloudflare_release_gate.py
          native_id=$(tail -n 1 container-evidence/image-ids.txt)
          test "$native_id" = "$(docker image inspect --format '{{.Id}}' dusk-cloudflare-runtime:ci)"
          test "$GITHUB_SHA" = "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$native_id")"
          docker tag "$native_id" "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          reference=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$IMAGE:sha-$GITHUB_SHA" |
            awk -v prefix="$IMAGE@" 'index($0, prefix) == 1 { print; exit }')
          test -n "$reference"
          digest=${reference##*@}
          printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          test "$reference" = "$IMAGE@$digest"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          mkdir -p image-evidence
          printf '%s\n' "$reference" > image-evidence/image-reference.txt
          printf '%s\n' "$GITHUB_SHA" > image-evidence/source-commit.txt
          native_name=$(printf '%s' "$native_id" | cut -c8-19)
          cp "container-evidence/$native_name.cdx.json" image-evidence/native-sbom.cdx.json
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign and verify the immutable image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-identity 'https://github.com/ShieldTech-Ltd/DUSK/.github/workflows/cloudflare-image.yml@refs/heads/main' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            > image-evidence/signature-verification.json
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ghcr.io/shieldtech-ltd/dusk-cloudflare-runtime
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/shieldtech-ltd/dusk-cloudflare-runtime
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: image-evidence/native-sbom.cdx.json
          push-to-registry: true
      - name: Verify provenance and SBOM attestations
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          gh attestation verify "oci://$IMAGE@$DIGEST" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/cloudflare-image.yml" \
            --source-ref refs/heads/main --source-digest "$GITHUB_SHA" \
            --predicate-type https://slsa.dev/provenance/v1 > image-evidence/provenance-verification.json
          gh attestation verify "oci://$IMAGE@$DIGEST" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/cloudflare-image.yml" \
            --source-ref refs/heads/main --source-digest "$GITHUB_SHA" \
            --predicate-type https://cyclonedx.org/bom > image-evidence/sbom-verification.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloudflare-image-${{ github.sha }}
          path: |
            image-evidence/
            container-evidence/
          if-no-files-found: error
          retention-days: 90
