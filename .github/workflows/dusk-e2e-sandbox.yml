name: DUSK E2E Sandbox

# Sandbox-only: never targets production resources.
# Protected by the `sandbox` environment which requires a reviewer approval
# and gates secrets. Real AWS/CF credentials are never available here.
#
# Worker unit tests and typecheck run locally (npm run test:worker / typecheck:worker).
# This workflow verifies Python integration correctness in the sandbox environment.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to test (default: current branch)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  e2e-sandbox:
    name: E2E (sandbox)
    runs-on: ubuntu-latest
    environment: sandbox
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test Python (unit)
        run: |
          PYTHONPATH=src python -m pytest -q \
            tests/test_cloudflare_gateway.py \
            tests/test_secure_action_flow.py
