name: Deep security
on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deep-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deep-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12", cache: pip, cache-dependency-path: pyproject.toml}
      - run: |
          pip install -e ".[dev]" pip-audit pip-licenses 'mutmut==2.4.5'
          pip install --require-hashes -r ci/example-requirements.lock
      - env: {GITHUB_AUTH_TOKEN: "${{ github.token }}"}
        run: >-
          python scripts/ci/run_group.py --results results/deep
          --controls SEC-015 SEC-016 SEC-019 SEC-027 SEC-028 SEC-029 SEC-030 SEC-031 SEC-032 SEC-033 SEC-034 --
          sh scripts/ci/deep_controls.sh
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: deep-control-results, path: results/, if-no-files-found: error, retention-days: 30}

  deep-security-gate:
    if: always()
    needs: [deep-controls]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}
      - run: pip install PyYAML
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: deep-control-results, path: results}
      - env: {UPSTREAM: "${{ needs.deep-controls.result }}"}
        run: |
          test "$UPSTREAM" = success
          python scripts/ci/control.py aggregate --lane deep --results results
