name: Deep security
on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deep-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deep-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12", cache: pip, cache-dependency-path: pyproject.toml}
      - run: |
          pip install -e ".[dev]" atheris pip-audit pip-licenses 'mutmut==2.4.5'
          pip install --require-hashes -r ci/example-requirements.lock
      - env:
          # A fine-grained read-only token is needed because GITHUB_TOKEN cannot
          # read classic branch-protection settings. The fallback fails visibly.
          GITHUB_AUTH_TOKEN: "${{ secrets.SCORECARD_TOKEN || github.token }}"
        run: sh scripts/ci/deep_controls.sh
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: deep-control-results, path: results/, if-no-files-found: error, retention-days: 30}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: deep-security-evidence, path: deep-evidence/, if-no-files-found: warn, retention-days: 30}

  deep-security-gate:
    if: always()
    needs: [deep-controls]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12"}
      - run: pip install PyYAML
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: deep-control-results, path: results}
      - env: {UPSTREAM: "${{ needs.deep-controls.result }}"}
        run: |
          aggregate_rc=0
          python scripts/ci/control.py aggregate --lane deep --results results || aggregate_rc=$?
          test "$UPSTREAM" = success && test "$aggregate_rc" -eq 0
