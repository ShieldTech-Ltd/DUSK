name: Deep security

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deep-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-history-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - name: Scan all reachable Git history
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 \
            git /repo --no-banner --redact --exit-code 1 \
            --report-format json --report-path deep-gitleaks.json
      - name: Upload full-history scan evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deep-history-secret-evidence
          path: deep-gitleaks.json
          if-no-files-found: warn
          retention-days: 30

  fresh-dependency-and-container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Re-audit dependencies against current vulnerability data
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --format json --output deep-pip-audit.json
      - name: Rebuild project images without layer cache
        run: >
          docker compose --project-name agent-action-monitor
          -f examples/agent-action-monitor/compose.yml build
          --pull --no-cache dusk-gate agent-demo mock-prod
      - name: Scan rebuilt gate image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: agent-action-monitor-dusk-gate
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: json
          output: deep-gate-trivy.json
      - name: Scan rebuilt agent image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: agent-action-monitor-agent-demo
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: json
          output: deep-agent-trivy.json
      - name: Scan rebuilt mock target image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: agent-action-monitor-mock-prod
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: json
          output: deep-mock-trivy.json
      - name: Re-run authenticated watch and enforce evidence
        working-directory: examples/agent-action-monitor
        env:
          DUSK_GATE_API_KEY: scheduled-ci-only-not-a-secret
        run: |
          sh ./scripts/run_ci_sandbox.sh watch
          sh ./scripts/run_ci_sandbox.sh enforce
      - name: Upload deep scan and sandbox evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deep-security-evidence
          path: |
            deep-pip-audit.json
            deep-*-trivy.json
            examples/agent-action-monitor/ci-logs/
          if-no-files-found: warn
          retention-days: 30

  deep-security-gate:
    if: always()
    needs: [full-history-secrets, fresh-dependency-and-container-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Fail visibly when a scheduled scan fails
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          failures=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"' <<<"$NEEDS_JSON")
          test -z "$failures" || { echo "$failures"; exit 1; }
