name: Control-plane OCI supply chain

on:
  push:
    branches: [dev]
    tags: ["v*"]
    paths-ignore: ["docs/**"]

permissions:
  contents: read

concurrency:
  group: control-plane-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/shieldtech-ltd/dusk-control-plane
          tags: |
            type=sha,format=long
            type=ref,event=tag
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: services/control-plane/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          build-args: |
            OCI_REVISION=${{ github.sha }}
            OCI_VERSION=${{ github.ref_name }}
            SOURCE_DATE_EPOCH=0
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign the immutable image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/shieldtech-ltd/dusk-control-plane
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Generate the immutable SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ghcr.io/shieldtech-ltd/dusk-control-plane@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: image-sbom.spdx.json
          upload-artifact: false
      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ghcr.io/shieldtech-ltd/dusk-control-plane
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Attest the SPDX SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/shieldtech-ltd/dusk-control-plane
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: image-sbom.spdx.json
          push-to-registry: true
      - name: Record immutable promotion input
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/shieldtech-ltd/dusk-control-plane
        run: |
          mkdir -p image-evidence
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > image-evidence/image-reference.txt
          cp image-sbom.spdx.json image-evidence/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: control-plane-image-${{ github.sha }}
          path: image-evidence/
          if-no-files-found: error
          retention-days: 90
