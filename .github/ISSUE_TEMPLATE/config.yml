# Issue template chooser configuration.
#
# blank_issues_enabled: true keeps the "Open a blank issue" escape hatch.
# Convention: the structured forms below are REQUIRED for routine bug reports
# and feature requests. The blank-issue route is reserved for *important /
# urgent* items that don't fit a form (e.g. coordinated triage, RFC-style
# design notes, incident follow-ups). Security vulnerabilities must NOT use a
# public issue, use the private advisory link below.
blank_issues_enabled: true

contact_links:
  - name: Security policy and private reporting
    url: https://github.com/ShieldTech-Ltd/DUSK/blob/main/SECURITY.md
    about: >-
      Do not open a public issue for vulnerabilities. Follow the private email
      route in SECURITY.md.
  - name: Questions & discussion
    url: https://github.com/ShieldTech-Ltd/DUSK/discussions
    about: Ask usage questions or discuss ideas (if Discussions is enabled).
