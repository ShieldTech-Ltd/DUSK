<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 900 420" width="900"
     font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">

  <defs>
    <!-- Motion paths for animateMotion particles -->
    <path id="mp-dusk-n8n"   d="M180,230 L220,230" fill="none"/>
    <path id="mp-n8n-tavily" d="M360,210 L400,190" fill="none"/>
    <path id="mp-n8n-notify" d="M360,230 L400,290" fill="none"/>
    <path id="mp-n8n-quar"   d="M360,250 L400,390" fill="none"/>
    <path id="mp-tav-done"   d="M540,190 L590,250" fill="none"/>
    <path id="mp-not-done"   d="M540,290 L590,290" fill="none"/>
    <path id="mp-qua-done"   d="M540,390 L590,330" fill="none"/>
  </defs>

  <style>
    /* ── base text ─────────────────────────────────────────── */
    text { white-space: pre; }

    /* ── flowing dashes on connector lines ─────────────────── */
    @keyframes flow-dash {
      from { stroke-dashoffset: 24; }
      to   { stroke-dashoffset: 0;  }
    }
    .flow { stroke-dasharray: 6 6; animation: flow-dash 0.8s linear infinite; }

    /* ── blinking dots ──────────────────────────────────────── */
    @keyframes blink-slow { 0%,100%{opacity:1} 50%{opacity:0.15} }
    @keyframes blink-fast { 0%,100%{opacity:1} 50%{opacity:0.1}  }
    @keyframes blink-med  { 0%,100%{opacity:1} 50%{opacity:0.2}  }
    .bl-slow { animation: blink-slow 1.4s ease-in-out infinite; }
    .bl-fast { animation: blink-fast 0.8s ease-in-out infinite; }
    .bl-med  { animation: blink-med  1.2s ease-in-out infinite; }

    /* ── status bar pulse ───────────────────────────────────── */
    @keyframes pulse-text { 0%,100%{opacity:1} 50%{opacity:0.6} }
    .st { animation: pulse-text 2s ease-in-out infinite; }
  </style>

  <!-- ═══════════════════════════════════════════════════════════
       CARD BACKGROUND
  ════════════════════════════════════════════════════════════ -->
  <rect x="0" y="0" width="900" height="420"
        rx="12" ry="12"
        fill="#07101f" stroke="#1e2d42" stroke-width="1"/>

  <!-- ═══════════════════════════════════════════════════════════
       TITLE BAR  (y 0–44)
  ════════════════════════════════════════════════════════════ -->
  <rect x="0" y="0" width="900" height="44"
        rx="12" ry="12" fill="#0d1628"/>
  <rect x="0" y="22" width="900" height="22" fill="#0d1628"/>
  <line x1="0" y1="44" x2="900" y2="44" stroke="#1e2d42"/>

  <!-- mac dots -->
  <circle cx="20" cy="22" r="5" fill="#ff5f56"/>
  <circle cx="38" cy="22" r="5" fill="#ffbd2e"/>
  <circle cx="56" cy="22" r="5" fill="#27c93f"/>

  <!-- title text -->
  <text x="74" y="27" font-size="13" font-weight="700" fill="#ffffff">DUSK × n8n</text>
  <text x="74" y="39" font-size="11" fill="#4a5568">  live integration demo · watch mode</text>

  <!-- right: animated active dot -->
  <circle class="bl-slow" cx="820" cy="22" r="5" fill="#3fb950"/>
  <text x="834" y="27" font-size="11" fill="#3fb950">ACTIVE</text>

  <!-- ═══════════════════════════════════════════════════════════
       STATUS BAR  (y 44–68)
  ════════════════════════════════════════════════════════════ -->
  <rect x="0" y="44" width="900" height="24" fill="#080c18"/>
  <line x1="0" y1="68" x2="900" y2="68" stroke="#1e2d42"/>

  <circle class="bl-med" cx="14" cy="56" r="4" fill="#56d4dd"/>
  <text class="st" x="26" y="60" font-size="9.5" fill="#56d4dd">
    DUSK alert received · n8n workflow triggered · enriching threat · notifying team
  </text>

  <!-- ═══════════════════════════════════════════════════════════
       NODE 1 — DUSK ALERT  (x=30, w=150, h=120, cy=230)
  ════════════════════════════════════════════════════════════ -->
  <rect x="30" y="170" width="150" height="120"
        rx="8" fill="#12060a" stroke="#f85149" stroke-width="1.5"/>
  <!-- blinking alert dot -->
  <circle class="bl-fast" cx="170" cy="180" r="5" fill="#f85149"/>

  <text x="105" y="196" font-size="14" font-weight="700"
        fill="#f85149" text-anchor="middle">DUSK</text>
  <text x="105" y="210" font-size="10" fill="#fca5a5" text-anchor="middle">WOULD-BLOCK fired</text>

  <line x1="40" y1="218" x2="170" y2="218" stroke="#1e2d42" stroke-width="0.5"/>

  <text x="44" y="232" font-size="9" fill="#fca5a5">agent    net-agent</text>
  <text x="44" y="247" font-size="9" fill="#f85149">score    0.95</text>
  <text x="44" y="262" font-size="9" fill="#f85149">blast    HIGH</text>
  <text x="44" y="277" font-size="9" fill="#4a5568">ATT&amp;CK  T1562.004</text>

  <!-- ═══════════════════════════════════════════════════════════
       CONNECTOR 1 — DUSK → n8n  (y=230, stroke #f85149)
  ════════════════════════════════════════════════════════════ -->
  <line class="flow" x1="180" y1="230" x2="220" y2="230"
        stroke="#f85149" stroke-width="1.5"/>
  <text x="183" y="222" font-size="9" fill="#475569">alert payload</text>
  <!-- arrowhead -->
  <polygon points="220,225 230,230 220,235" fill="#f85149"/>

  <!-- particle -->
  <circle r="4" fill="#f85149">
    <animateMotion dur="0.7s" repeatCount="indefinite">
      <mpath href="#mp-dusk-n8n"/>
    </animateMotion>
  </circle>

  <!-- ═══════════════════════════════════════════════════════════
       NODE 2 — N8N WEBHOOK  (x=230, w=140, h=120, cy=230)
  ════════════════════════════════════════════════════════════ -->
  <rect x="230" y="170" width="140" height="120"
        rx="8" fill="#120a0e" stroke="#ea4b71" stroke-width="1.5"/>

  <text x="300" y="205" font-size="20" font-weight="700"
        fill="#ea4b71" text-anchor="middle">n8n</text>
  <text x="300" y="220" font-size="10" fill="#ea4b71" text-anchor="middle">webhook trigger</text>

  <line x1="240" y1="228" x2="360" y2="228" stroke="#1e2d42" stroke-width="0.5"/>

  <text x="300" y="243" font-size="9" fill="#6b7280" text-anchor="middle">payload received</text>
  <text x="300" y="257" font-size="9" fill="#6b7280" text-anchor="middle">workflow started</text>
  <text x="300" y="271" font-size="9" fill="#ea4b71" text-anchor="middle">3 branches active</text>

  <!-- ═══════════════════════════════════════════════════════════
       CONNECTOR 2 — n8n → three parallel tracks
       Branch point at x=370
  ════════════════════════════════════════════════════════════ -->
  <!-- stem from n8n to branch point -->
  <line class="flow" x1="370" y1="190" x2="370" y2="390"
        stroke="#ea4b71" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- branch to Tavily -->
  <line class="flow" x1="370" y1="190" x2="400" y2="190"
        stroke="#0891b2" stroke-width="1.5"/>
  <polygon points="400,185 410,190 400,195" fill="#0891b2"/>

  <!-- branch to Notify -->
  <line class="flow" x1="370" y1="290" x2="400" y2="290"
        stroke="#7c3aed" stroke-width="1.5"/>
  <polygon points="400,285 410,290 400,295" fill="#7c3aed"/>

  <!-- branch to Quarantine -->
  <line class="flow" x1="370" y1="390" x2="400" y2="390"
        stroke="#d97706" stroke-width="1.5"/>
  <polygon points="400,385 410,390 400,395" fill="#d97706"/>

  <!-- particles n8n → tracks -->
  <circle r="3.5" fill="#0891b2">
    <animateMotion dur="0.9s" begin="0.1s" repeatCount="indefinite">
      <mpath href="#mp-n8n-tavily"/>
    </animateMotion>
  </circle>
  <circle r="3.5" fill="#7c3aed">
    <animateMotion dur="0.9s" begin="0.3s" repeatCount="indefinite">
      <mpath href="#mp-n8n-notify"/>
    </animateMotion>
  </circle>
  <circle r="3.5" fill="#d97706">
    <animateMotion dur="0.9s" begin="0.5s" repeatCount="indefinite">
      <mpath href="#mp-n8n-quar"/>
    </animateMotion>
  </circle>

  <!-- ═══════════════════════════════════════════════════════════
       TRACK A — TAVILY  (x=410, y=150, w=140, h=80)
  ════════════════════════════════════════════════════════════ -->
  <rect x="410" y="150" width="140" height="80"
        rx="8" fill="#060f15" stroke="#0891b2" stroke-width="1.5"/>
  <text x="480" y="174" font-size="12" font-weight="700"
        fill="#22d3ee" text-anchor="middle">Tavily</text>
  <text x="480" y="190" font-size="9" fill="#67e8f9" text-anchor="middle">real-time threat intel</text>
  <text x="480" y="204" font-size="9" fill="#6b7280" text-anchor="middle">CVEs · actor profiles</text>
  <text x="480" y="218" font-size="9" fill="#0e7490" text-anchor="middle">enrichment complete</text>

  <!-- TRACK B — NOTIFY  (x=410, y=250, w=140, h=80) -->
  <rect x="410" y="250" width="140" height="80"
        rx="8" fill="#0a0812" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="480" y="274" font-size="12" font-weight="700"
        fill="#a78bfa" text-anchor="middle">Slack / Teams</text>
  <text x="480" y="290" font-size="9" fill="#c4b5fd" text-anchor="middle">security team notified</text>
  <text x="480" y="304" font-size="9" fill="#6b7280" text-anchor="middle">incident #4821 created</text>
  <text x="480" y="318" font-size="9" fill="#5b21b6" text-anchor="middle">response SLA started</text>

  <!-- TRACK C — QUARANTINE  (x=410, y=350, w=140, h=60) -->
  <rect x="410" y="355" width="140" height="60"
        rx="8" fill="#100c04" stroke="#d97706" stroke-width="1.5"/>
  <text x="480" y="374" font-size="11" font-weight="700"
        fill="#fbbf24" text-anchor="middle">Agent Quarantine</text>
  <text x="480" y="388" font-size="9" fill="#fde68a" text-anchor="middle">net-agent isolated</text>
  <text x="480" y="402" font-size="9" fill="#6b7280" text-anchor="middle">baseline reset queued</text>

  <!-- ═══════════════════════════════════════════════════════════
       CONNECTOR 3 — tracks → RESOLVED
  ════════════════════════════════════════════════════════════ -->
  <!-- Tavily → Resolved -->
  <line class="flow" x1="550" y1="190" x2="590" y2="250"
        stroke="#16a34a" stroke-width="1.5"/>
  <!-- Notify → Resolved -->
  <line class="flow" x1="550" y1="290" x2="590" y2="290"
        stroke="#16a34a" stroke-width="1.5"/>
  <!-- Quarantine → Resolved -->
  <line class="flow" x1="550" y1="385" x2="590" y2="330"
        stroke="#16a34a" stroke-width="1.5"/>

  <!-- arrowheads into resolved -->
  <polygon points="588,245 598,250 588,255" fill="#16a34a"/>
  <polygon points="588,285 598,290 588,295" fill="#16a34a"/>
  <polygon points="588,325 598,330 588,335" fill="#16a34a"/>

  <!-- green particles flowing to resolved -->
  <circle r="3.5" fill="#4ade80">
    <animateMotion dur="1.1s" begin="0.2s" repeatCount="indefinite">
      <mpath href="#mp-tav-done"/>
    </animateMotion>
  </circle>
  <circle r="3.5" fill="#4ade80">
    <animateMotion dur="1.1s" begin="0.5s" repeatCount="indefinite">
      <mpath href="#mp-not-done"/>
    </animateMotion>
  </circle>
  <circle r="3.5" fill="#4ade80">
    <animateMotion dur="1.1s" begin="0.8s" repeatCount="indefinite">
      <mpath href="#mp-qua-done"/>
    </animateMotion>
  </circle>

  <!-- ═══════════════════════════════════════════════════════════
       NODE 5 — RESOLVED  (x=590, y=200, w=260, h=160)
  ════════════════════════════════════════════════════════════ -->
  <rect x="590" y="200" width="260" height="160"
        rx="8" fill="#06100a" stroke="#16a34a" stroke-width="1.5"/>
  <!-- blinking green dot -->
  <circle class="bl-slow" cx="840" cy="212" r="5" fill="#4ade80"/>

  <text x="720" y="224" font-size="13" font-weight="700"
        fill="#4ade80" text-anchor="middle">Incident Resolved</text>

  <line x1="600" y1="232" x2="840" y2="232" stroke="#14532d" stroke-width="0.5"/>

  <text x="606" y="248" font-size="9" fill="#86efac">&#10003; threat intel enriched via Tavily</text>
  <text x="606" y="264" font-size="9" fill="#86efac">&#10003; security team notified</text>
  <text x="606" y="280" font-size="9" fill="#86efac">&#10003; agent quarantined</text>
  <text x="606" y="296" font-size="9" fill="#86efac">&#10003; audit log SHA-256 signed</text>

  <line x1="600" y1="308" x2="840" y2="308" stroke="#14532d" stroke-width="0.5"/>

  <text x="720" y="325" font-size="9" font-weight="700"
        fill="#4ade80" text-anchor="middle">attacker received: zero data</text>
  <text x="720" y="340" font-size="9" fill="#166534" text-anchor="middle">detected in &lt;12ms · response in &lt;3s</text>
  <text x="720" y="354" font-size="8" fill="#14532d" text-anchor="middle">powered by DUSK · n8n · Tavily</text>

  <!-- ═══════════════════════════════════════════════════════════
       LEGEND  (y=408)
  ════════════════════════════════════════════════════════════ -->
  <line x1="0" y1="405" x2="900" y2="405" stroke="#1e2d42" stroke-width="0.5"/>
  <text x="450" y="416" font-size="9" fill="#4a5568" text-anchor="middle">
    DUSK detects · n8n orchestrates · Tavily enriches · team notified · agent healed
  </text>
  <text x="886" y="416" font-size="9" fill="#2a3a50" text-anchor="end">github.com/TFT444/DUSK</text>
</svg>
