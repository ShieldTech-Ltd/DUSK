<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 472" role="img"
     aria-labelledby="t d" preserveAspectRatio="xMidYMid meet" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">DUSK enterprise system architecture</title>
  <desc id="d">Four layers: AI agents, the DUSK inline gate, the decision split, and the Oracle AI Database 26ai integration. DUSK guards the agent action layer; a database SQL firewall guards the data layer.</desc>

  <style>
    :root { --fg: #1b2330; --muted: #5b6675; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #e6edf3; --muted: #9aa7b4; }
    }
    .fg { fill: var(--fg); }
    .muted { fill: var(--muted); }
    .lbl { font-size: 9px; font-weight: 700; letter-spacing: 2px; fill: var(--muted); }
    .h { font-size: 12px; font-weight: 700; fill: var(--fg); }
    .sub { font-size: 9px; fill: var(--muted); }
    .ver { font-size: 8.5px; font-weight: 700; letter-spacing: 1px; fill: #2dd4bf; }
    .flow { stroke-dasharray: 4 6; animation: dash 1s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -20; } }
  </style>

  <defs>
    <marker id="aT" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2dd4bf"/></marker>
    <marker id="aG" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#22c55e"/></marker>
    <marker id="aR" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#ef4444"/></marker>
    <marker id="aA" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#f59e0b"/></marker>
  </defs>

  <!-- Title -->
  <text x="40" y="28"><tspan font-size="16" font-weight="700" fill="#2dd4bf">DUSK</tspan><tspan class="muted" font-size="11" font-weight="400">  enterprise system architecture  ·  agent action security + Oracle 26ai</tspan></text>

  <!-- ===================== LAYER 0 : AI AGENTS ===================== -->
  <text x="40" y="56" class="lbl">LAYER 0 · AI AGENTS</text>

  <!-- agent boxes -->
  <g>
    <rect x="44"  y="66" width="168" height="44" rx="9" fill="#2dd4bf" fill-opacity="0.05" stroke="#2dd4bf" stroke-opacity="0.7" stroke-width="1.2"/>
    <text x="128" y="86"  text-anchor="middle" class="h">User Agent</text>
    <text x="128" y="100" text-anchor="middle" class="sub">routine ops</text>

    <rect x="230" y="66" width="168" height="44" rx="9" fill="#2dd4bf" fill-opacity="0.05" stroke="#2dd4bf" stroke-opacity="0.7" stroke-width="1.2"/>
    <text x="314" y="86"  text-anchor="middle" class="h">LLM Agent</text>
    <text x="314" y="100" text-anchor="middle" class="sub">data queries</text>

    <rect x="416" y="66" width="168" height="44" rx="9" fill="#f59e0b" fill-opacity="0.09" stroke="#f59e0b" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="1;0.35;1" dur="1.7s" repeatCount="indefinite"/>
    </rect>
    <text x="500" y="86"  text-anchor="middle" class="h" fill="#f59e0b">&#9888; Hijacked Agent</text>
    <text x="500" y="100" text-anchor="middle" class="sub" fill="#f59e0b" fill-opacity="0.85">prompt-injected · compromised</text>

    <rect x="602" y="66" width="168" height="44" rx="9" fill="#2dd4bf" fill-opacity="0.05" stroke="#2dd4bf" stroke-opacity="0.7" stroke-width="1.2"/>
    <text x="686" y="86"  text-anchor="middle" class="h">NetOps Agent</text>
    <text x="686" y="100" text-anchor="middle" class="sub">infra changes</text>

    <rect x="788" y="66" width="168" height="44" rx="9" fill="#2dd4bf" fill-opacity="0.05" stroke="#2dd4bf" stroke-opacity="0.7" stroke-width="1.2"/>
    <text x="872" y="86"  text-anchor="middle" class="h">Autonomous Agent</text>
    <text x="872" y="100" text-anchor="middle" class="sub">self-directed tasks</text>
  </g>

  <text x="500" y="130" text-anchor="middle" class="sub">all agent action requests</text>

  <!-- agent -> gate arrows -->
  <g fill="none" stroke-width="1.3">
    <line x1="128" y1="136" x2="128" y2="163" stroke="#2dd4bf" class="flow" marker-end="url(#aT)"/>
    <line x1="314" y1="136" x2="314" y2="163" stroke="#2dd4bf" class="flow" marker-end="url(#aT)"/>
    <line x1="500" y1="136" x2="500" y2="163" stroke="#f59e0b" class="flow" marker-end="url(#aA)"/>
    <line x1="686" y1="136" x2="686" y2="163" stroke="#2dd4bf" class="flow" marker-end="url(#aT)"/>
    <line x1="872" y1="136" x2="872" y2="163" stroke="#2dd4bf" class="flow" marker-end="url(#aT)"/>
  </g>

  <!-- ===================== LAYER 1 : DUSK INLINE GATE ===================== -->
  <text x="40" y="160" class="lbl">LAYER 1 · DUSK INLINE GATE</text>
  <rect x="36" y="168" width="928" height="84" rx="12" fill="#2dd4bf" fill-opacity="0.04" stroke="#2dd4bf" stroke-opacity="0.3" stroke-width="1"/>

  <g>
    <rect x="44"  y="178" width="168" height="66" rx="9" fill="#2dd4bf" fill-opacity="0.05" stroke="#2dd4bf" stroke-opacity="0.8" stroke-width="1.2"/>
    <text x="128" y="198" text-anchor="middle" class="h">Ingest</text>
    <text x="128" y="212" text-anchor="middle" class="sub">normalise to AgentAction</text>
    <text x="128" y="224" text-anchor="middle" class="sub">Azure · AWS · generic</text>
    <text x="128" y="238" text-anchor="middle" class="ver">v1.1</text>

    <rect x="230" y="178" width="168" height="66" rx="9" fill="#2dd4bf" fill-opacity="0.05" stroke="#2dd4bf" stroke-opacity="0.8" stroke-width="1.2"/>
    <text x="314" y="198" text-anchor="middle" class="h">Baseline</text>
    <text x="314" y="212" text-anchor="middle" class="sub">per-agent fingerprint</text>
    <text x="314" y="224" text-anchor="middle" class="sub">normal pattern model</text>
    <text x="314" y="238" text-anchor="middle" class="ver">v1.2</text>

    <rect x="416" y="178" width="168" height="66" rx="9" fill="#2dd4bf" fill-opacity="0.05" stroke="#2dd4bf" stroke-opacity="0.8" stroke-width="1.2"/>
    <text x="500" y="198" text-anchor="middle" class="h">Analyse</text>
    <text x="500" y="212" text-anchor="middle" class="sub">MITRE ATLAS · ATT&amp;CK</text>
    <text x="500" y="224" text-anchor="middle" class="sub">hijack pattern match</text>
    <text x="500" y="238" text-anchor="middle" class="ver">v1.3</text>

    <rect x="602" y="178" width="168" height="66" rx="9" fill="#2dd4bf" fill-opacity="0.05" stroke="#2dd4bf" stroke-opacity="0.8" stroke-width="1.2"/>
    <text x="686" y="198" text-anchor="middle" class="h">Predict</text>
    <text x="686" y="212" text-anchor="middle" class="sub">blast radius</text>
    <text x="686" y="224" text-anchor="middle" class="sub">kill-chain next stage</text>
    <text x="686" y="238" text-anchor="middle" class="ver">v1.3</text>

    <rect x="788" y="178" width="168" height="66" rx="9" fill="#2dd4bf" fill-opacity="0.05" stroke="#2dd4bf" stroke-opacity="0.8" stroke-width="1.2"/>
    <text x="872" y="197" text-anchor="middle" class="h">Verdict + Report</text>
    <text x="872" y="211" text-anchor="middle" font-size="9" font-weight="700"><tspan fill="#22c55e">ALLOW</tspan><tspan class="muted"> · </tspan><tspan fill="#f59e0b">WOULD-BLOCK</tspan></text>
    <text x="872" y="223" text-anchor="middle" font-size="9" font-weight="700"><tspan fill="#ef4444">BLOCK</tspan><tspan class="muted"> · full audit trail</tspan></text>
    <text x="872" y="238" text-anchor="middle" class="ver">v1.4</text>
  </g>

  <!-- pipeline connectors -->
  <g fill="none" stroke="#2dd4bf" stroke-width="1.3">
    <line x1="214" y1="211" x2="227" y2="211" marker-end="url(#aT)"/>
    <line x1="400" y1="211" x2="413" y2="211" marker-end="url(#aT)"/>
    <line x1="586" y1="211" x2="599" y2="211" marker-end="url(#aT)"/>
    <line x1="772" y1="211" x2="785" y2="211" marker-end="url(#aT)"/>
  </g>
  <!-- flowing pipeline dots -->
  <circle r="3.4" fill="#2dd4bf">
    <animateMotion dur="4.2s" repeatCount="indefinite" path="M128,211 H872"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.95;1" dur="4.2s" repeatCount="indefinite"/>
  </circle>
  <circle r="3.4" fill="#2dd4bf">
    <animateMotion dur="4.2s" begin="-2.1s" repeatCount="indefinite" path="M128,211 H872"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.95;1" dur="4.2s" begin="-2.1s" repeatCount="indefinite"/>
  </circle>

  <!-- ===================== LAYER 2 : DECISION ===================== -->
  <text x="40" y="274" class="lbl">LAYER 2 · DECISION</text>

  <!-- refuse path (diagonal, red) -->
  <path d="M540,246 L300,292" fill="none" stroke="#ef4444" stroke-width="1.3" class="flow" marker-end="url(#aR)"/>
  <text x="430" y="266" text-anchor="middle" font-size="9" font-weight="700" fill="#ef4444">verdict: refuse</text>

  <rect x="44" y="284" width="252" height="44" rx="9" fill="#ef4444" fill-opacity="0.08" stroke="#ef4444" stroke-width="1.4"/>
  <text x="170" y="304" text-anchor="middle" class="h" fill="#ef4444">Action Refused</text>
  <text x="170" y="318" text-anchor="middle" class="sub">alert raised · logged · quarantine</text>

  <!-- allow path (green, down to Oracle) -->
  <path d="M872,246 V356" fill="none" stroke="#22c55e" stroke-width="1.5" class="flow" marker-end="url(#aG)"/>
  <text x="888" y="300" font-size="11" font-weight="700" fill="#22c55e">ALLOW</text>
  <text x="888" y="313" class="sub">verdict: permit</text>

  <!-- ===================== LAYER 3 : ORACLE AI DATABASE 26ai ===================== -->
  <text x="40" y="352" class="lbl">LAYER 3 · ORACLE AI DATABASE 26ai</text>
  <rect x="36" y="360" width="928" height="80" rx="12" fill="#f97316" fill-opacity="0.05" stroke="#f97316" stroke-opacity="0.6" stroke-width="1.1"/>
  <text x="500" y="376" text-anchor="middle" font-size="9" font-weight="700" letter-spacing="1.5" fill="#f97316">ORACLE 26ai</text>

  <g>
    <rect x="48"  y="384" width="139" height="46" rx="8" fill="#ef4444" fill-opacity="0.06" stroke="#ef4444" stroke-opacity="0.75" stroke-width="1.1"/>
    <text x="117" y="403" text-anchor="middle" class="h" font-size="11">SQL Firewall</text>
    <text x="117" y="416" text-anchor="middle" class="sub">2nd line defence</text>
    <text x="117" y="426" text-anchor="middle" class="sub">at DB layer</text>

    <rect x="201" y="384" width="139" height="46" rx="8" fill="#f97316" fill-opacity="0.05" stroke="#f97316" stroke-opacity="0.6" stroke-width="1.1"/>
    <text x="270" y="403" text-anchor="middle" class="h" font-size="11">AI Vector Search</text>
    <text x="270" y="416" text-anchor="middle" class="sub">DUSK anomaly</text>
    <text x="270" y="426" text-anchor="middle" class="sub">similarity queries</text>

    <rect x="354" y="384" width="139" height="46" rx="8" fill="#f97316" fill-opacity="0.05" stroke="#f97316" stroke-opacity="0.6" stroke-width="1.1"/>
    <text x="423" y="403" text-anchor="middle" class="h" font-size="11">Property Graphs</text>
    <text x="423" y="416" text-anchor="middle" class="sub">agent relationship</text>
    <text x="423" y="426" text-anchor="middle" class="sub">mapping</text>

    <rect x="507" y="384" width="139" height="46" rx="8" fill="#f97316" fill-opacity="0.05" stroke="#f97316" stroke-opacity="0.6" stroke-width="1.1"/>
    <text x="576" y="403" text-anchor="middle" class="h" font-size="11">LLM Integration</text>
    <text x="576" y="416" text-anchor="middle" class="sub">natural language</text>
    <text x="576" y="426" text-anchor="middle" class="sub">alert summaries</text>

    <rect x="660" y="384" width="139" height="46" rx="8" fill="#f97316" fill-opacity="0.05" stroke="#f97316" stroke-opacity="0.6" stroke-width="1.1"/>
    <text x="729" y="403" text-anchor="middle" class="h" font-size="11">JSON / Relational</text>
    <text x="729" y="416" text-anchor="middle" class="sub">AgentAction events</text>
    <text x="729" y="426" text-anchor="middle" class="sub">stored and queried</text>

    <rect x="813" y="384" width="139" height="46" rx="8" fill="#22c55e" fill-opacity="0.05" stroke="#22c55e" stroke-opacity="0.6" stroke-width="1.1"/>
    <text x="882" y="403" text-anchor="middle" class="h" font-size="11">Autonomous DB</text>
    <text x="882" y="416" text-anchor="middle" class="sub">enterprise data</text>
    <text x="882" y="426" text-anchor="middle" class="sub">protected endpoint</text>
  </g>

  <text x="500" y="458" text-anchor="middle" class="sub">DUSK guards the agent layer · Oracle SQL Firewall guards the database layer · complementary, not competing</text>
</svg>
